name: cabo_counter
version: 1.0.9+1126
publish_to: none

environment:
  sdk: ^3.10.7
description: Mobile app for the card game Cabo

dependencies:
  collection: ^1.18.0
  confetti: ^0.8.0
  cupertino_icons: ^1.0.8
  drift: ^2.27.0
  drift_flutter: ^0.2.4
  file_picker: 10.1.2
  file_saver: ^0.3.1
  flutter:
    sdk: flutter
  flutter_keyboard_visibility: ^6.0.0
  flutter_localizations:
    sdk: flutter
  font_awesome_flutter: ^10.8.0
  google_fonts: ^6.3.0
  intl: any
  json_schema: ^5.2.1
  once: ^1.7.1
  package_info_plus: any
  path_provider: ^2.1.1
  provider: ^6.1.5+1
  # Temporary fix since the flutter fix is on stable channel
  # https://github.com/notDmDrl/pull_down_button/issues/74#issuecomment-3387231862
  pull_down_button:
    git:
      url: https://github.com/TimeFinderApp/pull_down_button
      ref: d7c9ffbc5b1617b385635a0f99b31ae35d13740b
  rate_my_app: ^2.3.2
  share_plus: ^12.0.1
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  syncfusion_flutter_charts: ^31.2.16
  url_launcher: any
  uuid: ^4.5.1
  vibration: ^3.1.3

dev_dependencies:
  build_runner: ^2.4.15
  dart_pubspec_licenses: ^3.0.14
  drift_dev: ^2.27.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  test: ^1.25.15

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/cabo_counter-logo_rounded.png
    - assets/game_list-schema.json
    - assets/game-schema.json
