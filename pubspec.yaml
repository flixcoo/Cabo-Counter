name: cabo_counter
description: "Mobile app for the card game Cabo"
publish_to: 'none'

version: 0.1.5+113

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^10.1.2
  file_saver: ^0.2.6
  flutter_keyboard_visibility: ^6.0.0
  font_awesome_flutter: ^10.8.0
  package_info_plus: any
  path_provider: ^2.1.1
  typed_data: ^1.3.2
  url_launcher: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.15


flutter:
  uses-material-design: false
  assets:
    - assets/cabo-counter-logo_rounded.png
