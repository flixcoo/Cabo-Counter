name: cabo_counter
description: "Mobile app for the card game Cabo"
publish_to: 'none'

version: 1.0.0+890

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^10.1.2
  file_saver: ^0.2.6
  flutter_keyboard_visibility: ^6.0.0
  font_awesome_flutter: ^10.8.0
  package_info_plus: any
  path_provider: ^2.1.1
  typed_data: ^1.3.2
  url_launcher: any
  json_schema: ^5.2.1
  shared_preferences: ^2.5.3
  logger: ^2.5.0
  flutter_localizations:
    sdk: flutter
  intl: any
  syncfusion_flutter_charts: ^30.1.37
  uuid: ^4.5.1
  rate_my_app: ^2.3.2
  reorderables: ^0.4.2
  collection: ^1.18.0
  confetti: ^0.6.0
  flutter_oss_licenses: ^2.0.1
  google_fonts: ^6.3.0
  drift: ^2.26.1
  drift_flutter: ^0.2.4
  provider: ^6.1.5+1
  shimmer: ^3.0.0
  pull_down_button: ^0.10.2
  share_plus: ^11.1.0
  flutter_vibrate: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.15
  drift_dev: ^2.26.1
  build_runner: ^2.4.15

flutter:
  generate: true
  uses-material-design: false
  assets:
    - assets/cabo_counter-logo_rounded.png
    - assets/game_list-schema.json
    - assets/game-schema.json
